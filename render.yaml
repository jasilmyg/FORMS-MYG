services:
  - type: web
    name: myg-forms
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT --timeout 600 --workers 2
    envVars:
      - key: GOOGLE_CREDENTIALS_JSON
        sync: false
      - key: TOKEN_PICKLE_B64
        sync: false
      - key: CLIENT_SECRET_JSON
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSLMODE
        sync: false
    disk:
      name: uploads
      mountPath: /opt/render/project/src/uploads
      sizeGB: 5
