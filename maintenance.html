<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Maintenance</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            background-color: #f4f7fb; /* Soft background color to blend with the image */
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .maintenance-bg {
            width: 100%;
            height: 100%;
            background-image: url('/static/maintenance-bg-mobile.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Use the landscape image for desktop/landscape screens */
        @media (min-aspect-ratio: 1/1) {
            .maintenance-bg {
                background-image: url('/static/maintenance-bg.png');
                background-size: cover;
            }
        }
    </style>
</head>
<body>
    <div class="maintenance-bg"></div>
</body>
</html>
