<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Maintenance</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100vh;
            background-color: #f7f9fc; /* Soft fallback background color */
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .maintenance-bg {
            width: 100%;
            height: 100%;
            background-image: url('/static/maintenance-bg.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* For very wide or very tall screens, contain might look better, but cover is usually preferred to avoid white borders */
        @media (max-aspect-ratio: 4/5) {
            .maintenance-bg {
                background-size: contain;
                background-position: top center;
                background-color: #f6fbff;
            }
        }
    </style>
</head>
<body>
    <div class="maintenance-bg"></div>
</body>
</html>
